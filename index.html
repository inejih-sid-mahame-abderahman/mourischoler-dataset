<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouriScholer · Scholarship Intelligence</title>
    <!-- No external dependencies — all self-contained -->
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --emerald: #059669;
            --emerald-light: #d1fae5;
            --emerald-dark: #064e3b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.06), 0 4px 6px rgba(0, 0, 0, 0.04);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-ar: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== RTL SUPPORT ========== */
        [dir="rtl"],
        .rtl {
            direction: rtl;
            text-align: right;
            font-family: var(--font-ar);
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* ========== LAYOUT ========== */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 240px;
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            padding: 20px 12px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.2s ease;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px 20px;
            border-bottom: 1px solid var(--gray-100);
            margin-bottom: 16px;
        }

        .sidebar-brand .logo {
            width: 32px;
            height: 32px;
            background: var(--emerald);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-brand h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }

        .sidebar-brand span {
            font-size: 10px;
            color: var(--gray-400);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            transition: all 0.15s;
            margin-bottom: 2px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--gray-100);
            color: var(--gray-800);
        }

        .nav-item.active {
            background: var(--emerald-light);
            color: var(--emerald-dark);
            font-weight: 600;
        }

        .nav-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-section {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--gray-400);
            padding: 16px 12px 6px;
        }

        /* ========== MAIN ========== */
        .main {
            flex: 1;
            margin-left: 240px;
            padding: 24px 32px 60px;
            min-width: 0;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 8px 12px 8px 34px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 13px;
            width: 220px;
            background: var(--white);
            transition: border-color 0.15s;
            font-family: var(--font);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .search-box .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--emerald);
            color: white;
        }
        .btn-primary:hover {
            background: var(--emerald-dark);
        }

        .btn-outline {
            background: var(--white);
            border-color: var(--gray-200);
            color: var(--gray-700);
        }
        .btn-outline:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
        }

        .btn-ghost {
            background: transparent;
            color: var(--gray-500);
            border: none;
            padding: 6px 8px;
        }
        .btn-ghost:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        /* ========== CARDS ========== */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .card-header .sub {
            font-size: 12px;
            color: var(--gray-400);
        }

        /* ========== KPI GRID ========== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            padding: 16px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.15s;
        }

        .kpi-card:hover {
            box-shadow: var(--shadow-md);
        }

        .kpi-card .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .kpi-card .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .kpi-card .sub {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: 2px;
        }

        .kpi-card .trend {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .trend-up {
            color: var(--emerald);
        }
        .trend-down {
            color: #dc2626;
        }
        .trend-neutral {
            color: var(--gray-400);
        }

        .kpi-card.emerald .value {
            color: var(--emerald);
        }

        /* ========== CHARTS ========== */
        .chart-container {
            position: relative;
            width: 100%;
            min-height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 8px 0;
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 180px;
            width: 100%;
            min-width: 300px;
        }

        .bar-chart .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            min-width: 24px;
            position: relative;
        }

        .bar-chart .bar {
            width: 100%;
            max-width: 40px;
            background: var(--emerald);
            border-radius: 4px 4px 0 0;
            transition: height 0.4s ease;
            min-height: 4px;
            position: relative;
            cursor: pointer;
        }

        .bar-chart .bar:hover {
            opacity: 0.8;
        }

        .bar-chart .bar-label {
            font-size: 10px;
            color: var(--gray-500);
            margin-top: 6px;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bar-chart .bar-value {
            font-size: 10px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 2px;
        }

        .donut-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .donut {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* ========== TABLES ========== */
        .table-wrap {
            overflow-x: auto;
            margin: 0 -4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            padding: 8px 10px;
            font-weight: 600;
            color: var(--gray-500);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-50);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: var(--gray-700);
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
            vertical-align: top;
        }

        tr:hover td {
            background: var(--gray-50);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.6;
            white-space: nowrap;
        }

        .badge-emerald {
            background: var(--emerald-light);
            color: var(--emerald-dark);
        }
        .badge-yellow {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-gray {
            background: var(--gray-100);
            color: var(--gray-600);
        }
        .badge-blue {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-purple {
            background: #ede9fe;
            color: #5b21b6;
        }

        /* ========== FILTER BAR ========== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 6px 10px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: var(--white);
            font-family: var(--font);
            color: var(--gray-700);
            cursor: pointer;
            max-width: 160px;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            outline: none;
            border-color: var(--emerald);
        }

        .filter-bar .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--emerald-light);
            color: var(--emerald-dark);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .filter-bar .chip .remove {
            cursor: pointer;
            font-weight: 700;
            opacity: 0.6;
        }
        .filter-bar .chip .remove:hover {
            opacity: 1;
        }

        /* ========== PAGINATION ========== */
        .pagination {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 5px 10px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            background: var(--white);
            cursor: pointer;
            font-size: 12px;
            color: var(--gray-600);
            transition: all 0.15s;
            font-family: var(--font);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .pagination button.active {
            background: var(--emerald);
            color: white;
            border-color: var(--emerald);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .info {
            font-size: 12px;
            color: var(--gray-400);
            margin: 0 8px;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--gray-400);
            padding: 0 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--gray-600);
        }

        .modal-section {
            margin-bottom: 16px;
        }

        .modal-section h4 {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .modal-section .field {
            margin-bottom: 6px;
            font-size: 13px;
        }

        .modal-section .field .key {
            color: var(--gray-500);
            font-weight: 500;
            margin-right: 4px;
        }

        .modal-section .field .val {
            color: var(--gray-800);
        }

        .modal-section .raw {
            background: var(--gray-50);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--gray-600);
            white-space: pre-wrap;
            word-break: break-word;
            direction: auto;
            max-height: 100px;
            overflow-y: auto;
        }

        /* ========== EXECUTIVE SUMMARY ========== */
        .exec-summary {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid #a7f3d0;
            margin-bottom: 20px;
        }

        .exec-summary h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--emerald-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .exec-summary ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .exec-summary li {
            font-size: 13px;
            color: var(--gray-700);
            padding-left: 18px;
            position: relative;
            line-height: 1.5;
        }

        .exec-summary li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--emerald);
            font-weight: 700;
        }

        /* ========== MESSAGE BOX ========== */
        .message-box {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 13px;
            color: var(--gray-700);
            white-space: pre-wrap;
            word-break: break-word;
            direction: auto;
            position: relative;
            line-height: 1.6;
            max-height: 180px;
            overflow-y: auto;
        }

        .message-box .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            padding: 3px 8px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            cursor: pointer;
            color: var(--gray-500);
            font-family: var(--font);
        }

        .message-box .copy-btn:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-400);
        }

        .empty-state .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ========== LOADING ========== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--gray-400);
            font-size: 14px;
        }

        .loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-200);
            border-top-color: var(--emerald);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding: 16px;
            }
            .menu-toggle {
                display: flex !important;
            }
            .header h2 {
                font-size: 18px;
            }
        }

        @media (max-width: 640px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .kpi-card .value {
                font-size: 20px;
            }
            .header-actions {
                width: 100%;
            }
            .search-box input {
                width: 100%;
            }
            .filter-bar select,
            .filter-bar input {
                max-width: 100%;
                flex: 1;
            }
            .modal {
                padding: 16px;
            }
            .donut-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .bar-chart .bar-label {
                font-size: 8px;
                max-width: 36px;
            }
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--gray-600);
            padding: 4px 8px;
        }

        /* ========== UTILITY ========== */
        .hidden {
            display: none !important;
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .gap-8 {
            gap: 8px;
        }
        .flex {
            display: flex;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .text-sm {
            font-size: 12px;
        }
        .text-xs {
            font-size: 11px;
        }
        .text-muted {
            color: var(--gray-400);
        }
        .text-emerald {
            color: var(--emerald);

        function normalizeArabic(str) {
            if (!str) return '';
            return str
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/[ىي]/g, 'ي')
                .replace(/ة/g, 'ه')
                .replace(/[ًٌٍَُِّْ]/g, '')
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                .replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        function normalizeText(str) {
            if (!str) return '';
            let s = String(str).trim();
            s = s.replace(/<br\s*\/?>/gi, ' ');
            s = s.replace(/\s+/g, ' ');
            s = normalizeArabic(s);

        function parsePhone(raw) {
            const result = { raw: raw || '', cleaned: '', hasCountryCode: false, countryCode: null, country: null, isLocalFormat: false, isValid: false, isMissing: true, signal: 'Missing' };
            if (!raw || !String(raw).trim()) {
                return result;
            }
            result.isMissing = false;
            let s = String(raw).trim();
            s = toWesternNumerals(s);
            s = s.replace(/[\s\-\(\)\.]/g, '');
            s = s.replace(/[^\d+]/g, '');
            result.cleaned = s;

            if (!s || s === '+' || s.length < 4) {
                result.signal = 'Invalid / unclear';
                return result;
            }

            if (s.startsWith('+')) {
                result.hasCountryCode = true;
                const num = s.substring(1);
                // Try matching longest country code first
                const codes = Object.keys(COUNTRY_CODES).sort((a, b) => b.length - a.length);
                for (const code of codes) {
                    if (num.startsWith(code)) {
                        result.countryCode = code;
                        result.country = COUNTRY_CODES[code];
                        result.isValid = true;
                        result.signal = COUNTRY_CODES[code];
                        return result;
                    }
                }
                result.signal = 'International (unrecognized)';
                return result;
            }

            // Try to detect country code without +
            const codes = Object.keys(COUNTRY_CODES).sort((a, b) => b.length - a.length);
            for (const code of codes) {
                if (s.startsWith(code) && s.length > code.length + 4) {
                    result.hasCountryCode = true;
                    result.countryCode = code;
                    result.country = COUNTRY_CODES[code];
                    result.isValid = true;
                    result.signal = COUNTRY_CODES[code] + ' (no +)';
                    return result;
                }
            }

            // Mauritanian local format: 8 digits starting with 2,3,4

                result.isLocalFormat = true;
                result.country = 'Mauritania';
                result.countryCode = '222';
                result.isValid = true;
                result.signal = 'Mauritania (local format)';
                return result;
            }

            if (emailRegex.test(s)) {

                }

            const sNorm = normalizeArabic(s);

            // Check for explicit refusal / free-only
            if (/\b(لا ادفع|مش هدفع|لن ادفع|لا أدفع|رفض|free only|no payment|لا املك|ليس لدي مال|ما عندي|مش معايا|ما معي|لا أملك|لا استطيع الدفع|لا أقدر|لا اقدر|لا يوجد مال|ما في مال|ليس عندي|معنديش|معندي|ما عنديش|لا امتلك|مش قادر|مش قادرة|لا يمكنني الدفع)\b/.test(sNorm)) {
                result.category = 'unable';
                result.intent = 1;
                result.confidence = 'high';
                result.reason = 'Explicitly stated inability to pay';
                return result;
            }

            // Check for free-only
            if (/\b(مجانا|مجاني|مجاناً|free|بالمجان|دون مقابل|بدون مقابل|هدية)\b/.test(sNorm)) {
                result.category = 'free_only';
                result.intent = 0;
                result.confidence = 'medium';
                result.reason = 'Wants free service';
                return result;
            }

            // Check for conditional payment
            if (/\b(بعد القبول|بعد الموافقة|بعد القبول|بعد ما انقبل|اذا انقبلت|إذا انقبلت|بعد النتيجة|after acceptance|if accepted|بعد الحصول على المنحة|بعد ما احصل|conditional)\b/.test(sNorm)) {
                result.category = 'conditional';
                result.intent = 3;
                result.confidence = 'medium';
                result.condition = 'after_acceptance';
                result.reason = 'Willing to pay conditionally (after acceptance)';
                return result;
            }

            // Check for price sensitive / depends
            if (/\b(على حسب|حسب|depends|معقول|مناسب|قدر|استطاعة|امكانية|في المتناول|affordable|reasonable|small amount|بسيط|قليل|مش كثير|مش كتير)\b/.test(sNorm)) {
                result.category = 'price_sensitive';
                result.intent = 2;
                result.confidence = 'medium';
                result.reason = 'Price sensitive / depends on affordability';
                return result;
            }

            // Check for strong willingness (yes, ready, willing)
            if (/\b(نعم|اكيد|أكيد|مستعد|مستعدة|ready|willing|جاهز|موافق|طبعا|بالتأكيد|sure|yes|اوافق)\b/.test(sNorm)) {
                result.category = 'strong_willingness';
                result.intent = 4;
                result.confidence = 'medium';
                result.reason = 'Explicit willingness to pay without specific amount';
                return result;
            }

            // Try to extract amount and currency
            const amountPatterns = [
                { regex: /\$(\d+(?:[.,]\d+)?)/, currency: 'USD', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*دولار/, currency: 'USD', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*dollar/i, currency: 'USD', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*usd/i, currency: 'USD', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*ريال/, currency: 'SAR', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*sar/i, currency: 'SAR', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*جنيه/, currency: 'EGP', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*egp/i, currency: 'EGP', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*أوقية/, currency: 'MRU', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*اوقية/, currency: 'MRU', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*mru/i, currency: 'MRU', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*يورو/, currency: 'EUR', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*€/, currency: 'EUR', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*eur/i, currency: 'EUR', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*شيكل/, currency: 'ILS', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*ils/i, currency: 'ILS', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*₪/, currency: 'ILS', conf: 'high' },
                { regex: /(\d+(?:[.,]\d+)?)\s*دينار/, currency: 'JOD', conf: 'medium' },
                { regex: /(\d+(?:[.,]\d+)?)\s*جنيه سوداني/, currency: 'SDG', conf: 'medium' },
                { regex: /(\d+(?:[.,]\d+)?)\s*sdg/i, currency: 'SDG', conf: 'medium' }
            ];

            for (const p of amountPatterns) {
                const m = s.match(p.regex);
                if (m) {
                    let amtStr = m[1] || m[2];
                    if (amtStr) {
                        amtStr = amtStr.replace(/,/g, '');
                        const amt = parseFloat(amtStr);
                        if (!isNaN(amt) && amt > 0) {
                            result.amount = amt;
                            result.currency = p.currency;
                            result.currencyConfidence = p.conf;
                            result.category = 'explicit_amount';
                            result.intent = 5;
                            result.confidence = 'high';
                            result.reason = `Explicit amount: ${amt} ${p.currency}`;
                            return result;
                        }
                    }
                }
            }

            // Try generic number extraction
            const numMatch = s.match(/(\d+(?:[.,]\d+)?)/);
            if (numMatch) {
                let amtStr = numMatch[1].replace(/,/g, '');
                const amt = parseFloat(amtStr);
                if (!isNaN(amt) && amt > 0) {
                    result.amount = amt;
                    result.currency = 'UNKNOWN';
                    result.currencyConfidence = 'low';
                    result.category = 'explicit_amount';
                    result.intent = 4;
                    result.confidence = 'low';
                    result.reason = `Amount stated (${amt}) but currency unclear`;
                    return result;
                }
            }

            // If we got here, it's unclear
            result.category = 'unclear';
            result.intent = 0;
            result.confidence = 'low';
            result.reason = 'Could not determine payment intent from answer';
            return result;
        }

        // ============================================================
        // SERVICE PARSER
        // ============================================================

        function parseServices(raw) {
            if (!raw || !String(raw).trim()) return [];
            const s = String(raw);
            const found = new Set();

            // Split by common separators
            const parts = s.split(/[,،\n]+/).map(p => p.trim()).filter(Boolean);

            for (const part of parts) {
                const pNorm = normalizeText(part);
                for (const [service, keywords] of Object.entries(CONFIG.serviceMap)) {
                    for (const kw of keywords) {
                        if (pNorm.includes(normalizeText(kw))) {
                            found.add(service);
                            break;
                        }
                    }
                }
            }

            return Array.from(found);
        }

        // ============================================================
        // EDUCATION NORMALIZER
        // ============================================================

        function normalizeEducation(raw) {
            if (!raw || !String(raw).trim()) return 'Unknown';
            const s = normalizeText(raw);
            for (const [cat, keywords] of Object.entries(CONFIG.educationMap)) {
                for (const kw of keywords) {
                    if (s.includes(normalizeText(kw))) {
                        return cat;
                    }
                }
            }
            return 'Other';
        }

        // ============================================================
        // DESTINATION NORMALIZER
        // ============================================================

        function normalizeDestination(raw) {
            if (!raw || !String(raw).trim()) return 'Unknown';
            const s = normalizeText(raw);
            // Check for multiple destinations - use first match
            for (const [cat, keywords] of Object.entries(CONFIG.destinationMap)) {
                for (const kw of keywords) {
                    if (s.includes(normalizeText(kw))) {
                        return cat;
                    }
                }
            }
            return 'Other';
        }

        // ============================================================
        // PAIN POINT NORMALIZER
        // ============================================================

        function normalizePain(raw) {
            if (!raw || !String(raw).trim()) return 'No stated problem';
            const s = normalizeText(raw);
            for (const [cat, keywords] of Object.entries(CONFIG.painMap)) {
                for (const kw of keywords) {
                    if (s.includes(normalizeText(kw))) {
                        return cat;
                    }
                }
            }
            return 'Other';
        }

        // ============================================================
        // INTEREST NORMALIZER
        // ============================================================

        function normalizeInterest(raw) {
            if (!raw || !String(raw).trim()) return 'Unknown';
            const s = normalizeText(raw);
            if (s.includes('yes') || s.includes('نعم') || s.includes('أكيد') || s.includes('اكيد')) return 'Yes';
            if (s.includes('maybe') || s.includes('ربما') || s.includes('ممكن')) return 'Maybe';
            if (s.includes('no') || s.includes('لا') || s.includes('ليس')) return 'No';
            return 'Unknown';
        }

        // ============================================================
        // PROCESS RECORDS
        // ============================================================

        function processRecords(data) {
            return data.map((row, index) => {
                const phoneInfo = parsePhone(row.phone);
                const emailInfo = parseEmail(row.email);
                const paymentInfo = parsePayment(row.amount);
                const services = parseServices(row.services);
                const educationCat = normalizeEducation(row.education);
                const destinationCat = normalizeDestination(row.destination);
                const painCat = normalizePain(row.pain);
                const interestCat = normalizeInterest(row.interest);
                const timestamp = parseTimestamp(row.timestamp);

                // Contactability
                let contactability = 'Neither';
                if (phoneInfo.isValid && emailInfo.isValid) contactability = 'WhatsApp + Email';
                else if (phoneInfo.isValid) contactability = 'WhatsApp only';
                else if (emailInfo.isValid) contactability = 'Email only';

                // Segments
                const segments = [];
                if (services.includes('Personal guidance') && (paymentInfo.intent >= 3 || paymentInfo.category === 'strong_willingness' || paymentInfo.category === 'explicit_amount')) {
                    segments.push('High-intent personal guidance');
                }
                if (services.includes('Application review')) segments.push('Application-review seekers');
                if (services.includes('Scholarship database')) segments.push('Scholarship discovery seekers');
                if (services.includes('Step-by-step application guides')) segments.push('Step-by-step learners');
                if (paymentInfo.category === 'unable' || paymentInfo.category === 'free_only') segments.push('Free-resource seekers');
                if (paymentInfo.category === 'conditional') segments.push('Conditional payers');
                if (phoneInfo.country && phoneInfo.country !== 'Mauritania' && phoneInfo.hasCountryCode) segments.push('International applicants');
                if (phoneInfo.country === 'Mauritania' || phoneInfo.signal === 'Mauritania (local format)') segments.push('Mauritanian audience');
                if (educationCat === 'High school student') segments.push('High-school applicants');
                if (educationCat === 'University student') segments.push('University applicants');
                if (educationCat === 'Graduate' || educationCat === 'Recent graduate' || educationCat === 'Masters/postgraduate') segments.push('Graduates/postgraduates');

                // Lead priority scoring
                let leadScore = 0;
                const leadReasons = [];

                if (interestCat === 'Yes') { leadScore += 20; leadReasons.push('Expressed interest in guidance'); }
                if (services.includes('Personal guidance')) { leadScore += 15; leadReasons.push('Wants personal guidance'); }
                if (services.includes('Application review')) { leadScore += 10; leadReasons.push('Wants application review'); }
                if (services.includes('Scholarship database')) { leadScore += 5; leadReasons.push('Wants scholarship database'); }
                if (services.includes('Step-by-step application guides')) { leadScore += 5; leadReasons.push('Wants step-by-step guides'); }
                if (paymentInfo.intent >= 4) { leadScore += 25; leadReasons.push('Explicit willingness to pay'); }
                if (paymentInfo.intent === 5) { leadScore += 15; leadReasons.push('Stated explicit amount'); }
                if (paymentInfo.intent === 3) { leadScore += 10; leadReasons.push('Conditional willingness to pay'); }
                if (phoneInfo.isValid) { leadScore += 10; leadReasons.push('Has WhatsApp number'); }
                if (emailInfo.isValid) { leadScore += 5; leadReasons.push('Has valid email'); }
                if (destinationCat !== 'Unknown' && destinationCat !== 'Other') { leadScore += 5; leadReasons.push('Clear study destination'); }
                if (painCat !== 'No stated problem' && painCat !== 'Other') { leadScore += 5; leadReasons.push('Stated clear pain point'); }

                // Urgency detection
                const urgencyKeywords = ['urgent', 'عاجل', 'مستعجل', 'باقرب وقت', 'as soon as possible', 'اسرع', 'بسرعة', 'الوقت ضيق', 'آخر موعد', 'deadline'];
                const painNorm = normalizeText(row.pain || '');
                const goalNorm = normalizeText(row.goal || '');
                const isUrgent = urgencyKeywords.some(kw => painNorm.includes(kw) || goalNorm.includes(kw));
                if (isUrgent) { leadScore += 10; leadReasons.push('Expressed urgency'); }

                return {
                    index,
                    timestamp,
                    timestampRaw: row.timestamp,
                    phone: row.phone,
                    phoneInfo,
                    email: row.email,
                    emailInfo,
                    name: row.name || 'Unknown',
                    educationRaw: row.education,
                    educationCategory: educationCat,
                    goal: row.goal || '',
                    destinationRaw: row.destination,
                    destinationCategory: destinationCat,
                    painRaw: row.pain || '',
                    painCategory: painCat,
                    interestRaw: row.interest,
                    interestCategory: interestCat,
                    servicesRaw: row.services || '',
                    services,
                    other: row.other || '',
                    worthRaw: row.worth || '',
                    amountRaw: row.amount || '',
                    paymentInfo,
                    contactability,
                    segments,
                    leadScore,
                    leadReasons,
                    isUrgent
                };
            });
        }

        // ============================================================
        // PROCESSED DATA
        // ============================================================

        let allRecords = [];
        let filteredRecords = [];
        let currentPage = 1;
        const PAGE_SIZE = 25;
        let currentSort = { field: 'leadScore', dir: 'desc' };
        let activeFilters = {
            education: '',
            interest: '',
            destination: '',
            service: '',
            payment: '',
            contact: '',
            dateFrom: '',
            dateTo: '',
            search: ''
        };

        // ============================================================
        // STATISTICS HELPERS
        // ============================================================

        function countBy(records, field) {
            const map = {};
            records.forEach(r => {
                const val = r[field] || 'Unknown';
                map[val] = (map[val] || 0) + 1;
            });
            return map;
        }

        function countServices(records) {
            const map = {};
            records.forEach(r => {
                (r.services || []).forEach(s => {
                    map[s] = (map[s] || 0) + 1;
                });
            });
            return map;
        }

        function countSegments(records) {
            const map = {};
            records.forEach(r => {
                (r.segments || []).forEach(s => {
                    map[s] = (map[s] || 0) + 1;
                });
            });
            return map;
        }

        function getCurrencyStats(records) {
            const map = {};
            records.forEach(r => {
                const p = r.paymentInfo;
                if (p && p.amount && p.currency && p.currency !== 'UNKNOWN') {
                    if (!map[p.currency]) map[p.currency] = [];
                    map[p.currency].push(p.amount);
                }
            });
            const stats = {};
            for (const [cur, amounts] of Object.entries(map)) {
                if (amounts.length === 0) continue;
                amounts.sort((a, b) => a - b);
                const sum = amounts.reduce((a, b) => a + b, 0);
                const mean = sum / amounts.length;
                const median = amounts.length % 2 === 0
                    ? (amounts[amounts.length / 2 - 1] + amounts[amounts.length / 2]) / 2
                    : amounts[Math.floor(amounts.length / 2)];
                const min = amounts[0];
                const max = amounts[amounts.length - 1];
                const q1 = amounts[Math.floor(amounts.length * 0.25)];
                const q3 = amounts[Math.floor(amounts.length * 0.75)];
                const iqr = q3 - q1;
                const outliers = amounts.filter(a => a < q1 - 1.5 * iqr || a > q3 + 1.5 * iqr).length;
                stats[cur] = { count: amounts.length, min, max, median, mean, sum, outliers, amounts };
            }
            return stats;
        }

        // ============================================================
        // FILTERING
        // ============================================================

        function applyFilters() {
            const f = activeFilters;
            const search = normalizeText(f.search);
            filteredRecords = allRecords.filter(r => {
                // Education
                if (f.education && r.educationCategory !== f.education) return false;
                // Interest
                if (f.interest && r.interestCategory !== f.interest) return false;
                // Destination
                if (f.destination && r.destinationCategory !== f.destination) return false;
                // Service
                if (f.service && !(r.services || []).includes(f.service)) return false;
                // Payment
                if (f.payment && r.paymentInfo.category !== f.payment) return false;
                // Contact
                if (f.contact) {
                    if (f.contact === 'WhatsApp + Email' && r.contactability !== 'WhatsApp + Email') return false;
                    if (f.contact === 'WhatsApp only' && r.contactability !== 'WhatsApp only') return false;
                    if (f.contact === 'Email only' && r.contactability !== 'Email only') return false;
                    if (f.contact === 'Neither' && r.contactability !== 'Neither') return false;
                }
                // Date range
                if (f.dateFrom && r.timestamp && r.timestamp < new Date(f.dateFrom)) return false;
                if (f.dateTo && r.timestamp && r.timestamp > new Date(f.dateTo + 'T23:59:59')) return false;
                // Search
                if (search) {
                    const fields = [
                        r.name, r.phone, r.email, r.goal, r.destinationRaw, r.painRaw,
                        r.servicesRaw, r.other, r.amountRaw, r.educationRaw,
                        r.destinationCategory, r.painCategory, r.educationCategory,
                        ...(r.services || [])
                    ];
                    const combined = fields.filter(Boolean).map(f => normalizeText(String(f))).join(' ');
                    if (!combined.includes(search)) return false;
                }
                return true;
            });
            currentPage = 1;
        }

        // ============================================================
        // SORTING
        // ============================================================

        function sortRecords(records) {
            const { field, dir } = currentSort;
            const sorted = [...records];
            sorted.sort((a, b) => {
                let va = a[field], vb = b[field];
                if (field === 'leadScore') { va = a.leadScore || 0; vb = b.leadScore || 0; }
                if (field === 'name') { va = a.name || ''; vb = b.name || ''; }
                if (field === 'education') { va = a.educationCategory || ''; vb = b.educationCategory || ''; }
                if (field === 'destination') { va = a.destinationCategory || ''; vb = b.destinationCategory || ''; }
                if (field === 'payment') { va = a.paymentInfo?.category || ''; vb = b.paymentInfo?.category || ''; }
                if (typeof va === 'string') {
                    return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
                }
                return dir === 'asc' ? (va || 0) - (vb || 0) : (vb || 0) - (va || 0);
            });
            return sorted;
        }

        // ============================================================
        // EXPORT
        // ============================================================

        function exportCSV(records) {
            const headers = [
                'Name', 'Phone', 'Email', 'Education', 'Scholarship Goal',
                'Destination', 'Pain Point', 'Services', 'Interest',
                'Payment Category', 'Payment Amount', 'Payment Currency',
                'Payment Intent', 'Payment Confidence', 'Lead Priority',
                'Lead Reason', 'Segment', 'Timestamp'
            ];
            const rows = records.map(r => [
                r.name, r.phone, r.email, r.educationCategory, r.goal,
                r.destinationCategory, r.painCategory, (r.services || []).join('; '),
                r.interestCategory, r.paymentInfo?.category || '',
                r.paymentInfo?.amount || '', r.paymentInfo?.currency || '',
                r.paymentInfo?.intent || '', r.paymentInfo?.confidence || '',
                r.leadScore || 0, (r.leadReasons || []).join('; '),
                (r.segments || []).join('; '), r.timestampRaw
            ]);
            const csv = [headers, ...rows].map(row =>
                row.map(cell => {
                    const s = String(cell || '');
                    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
                        return '"' + s.replace(/"/g, '""') + '"';
                    }
                    return s;
                }).join(',')
            ).join('\n');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mourischoler-export-' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // CHART RENDERING (Canvas-based)
        // ============================================================

        function renderBarChart(container, data, options = {}) {
            const { labelKey = 'label', valueKey = 'value', color = '#059669', maxBars = 15 } = options;
            let items = Array.isArray(data) ? data : Object.entries(data).map(([k, v]) => ({ label: k, value: v }));
            items.sort((a, b) => b[valueKey] - a[valueKey]);
            items = items.slice(0, maxBars);

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No data</p></div>';
                return;
            }

            const maxVal = Math.max(...items.map(i => i[valueKey]), 1);
            let html = '<div class="bar-chart">';
            items.forEach(item => {
                const pct = (item[valueKey] / maxVal) * 100;
                html += `<div class="bar-wrapper">
                    <div class="bar-value">${item[valueKey]}</div>
                    <div class="bar" style="height:${Math.max(pct, 2)}%;background:${color};" data-tooltip="${item[labelKey]}: ${item[valueKey]}"></div>
                    <div class="bar-label" title="${item[labelKey]}">${item[labelKey]}</div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderDonut(container, data, colors) {
            let items = Array.isArray(data) ? data : Object.entries(data).map(([k, v]) => ({ label: k, value: v }));
            items.sort((a, b) => b.value - a.value);
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No data</p></div>';
                return;
            }
            const total = items.reduce((s, i) => s + i.value, 0);
            const defaultColors = ['#059669', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6b7280'];
            let angle = 0;
            const gradientParts = [];
            items.forEach((item, i) => {
                const pct = (item.value / total) * 100;
                const color = (colors && colors[i]) || defaultColors[i % defaultColors.length];
                const startAngle = angle;
                const endAngle = angle + (pct / 100) * 360;
                gradientParts.push(`${color} ${startAngle}deg ${endAngle}deg`);
                angle = endAngle;
            });
            const gradient = `conic-gradient(${gradientParts.join(', ')})`;
            let html = `<div class="donut-container"><div class="donut" style="background:${gradient};"></div><div class="donut-legend">`;
            items.forEach((item, i) => {
                const color = (colors && colors[i]) || defaultColors[i % defaultColors.length];
                const pct = ((item.value / total) * 100).toFixed(1);
                html += `<div class="legend-item"><span class="legend-dot" style="background:${color};"></span><span>${item.label} <strong>${item.value}</strong> (${pct}%)</span></div>`;
            });
            html += '</div></div>';
            container.innerHTML = html;
        }

                        <h4 style="font-size:13px;color:var(--emerald-dark);margin-bottom:6px;">⚠️ What are they struggling with?</h4>
                        <p style="font-size:13px;">Most common pain point: <strong>${topPain ? topPain[0] : '—'}</strong> (${topPain ? topPain[1] : 0} respondents). This includes difficulty finding scholarships, understanding requirements, and preparing documents.</p>
                    </div>
                    <div>
                        <h4 style="font-size:13px;color:var(--emerald-dark);margin-bottom:6px;">💰 What payment behavior appears?</h4>
                        <p style="font-size:13px;"><strong>${explicitCount}</strong> respondents gave an explicit amount. <strong>${conditionalCount}</strong> indicated conditional willingness (e.g., after acceptance). <strong>${unableCount}</strong> explicitly stated inability to pay. Survey evidence suggests price sensitivity is significant, with many respondents requesting free or affordable options.</p>
                    </div>
                    <div>
                        <h4 style="font-size:13px;color:var(--emerald-dark);margin-bottom:6px;">📞 Who should be contacted?</h4>
                        <p style="font-size:13px;"><strong>${contactable}</strong> respondents are contactable via WhatsApp or email. High-intent leads (lead score ≥ 50) should be prioritized for personal guidance and application review services.</p>
                    </div>
                    <div>
                        <h4 style="font-size:13px;color:var(--emerald-dark);margin-bottom:6px;">🔬 What should we research next?</h4>
                        <p style="font-size:13px;">The current form does not tell us: (1) whether respondents would actually pay when asked directly, (2) what specific price points they consider reasonable for each service, (3) how many have successfully obtained scholarships before, (4) what channels they prefer for communication, (5) their timeline/urgency for applying.</p>
                    </div>
                </div>
            </div>
            <div class="card mt-16">
                <div class="card-header"><h3>Content Opportunity Engine</h3></div>
                <ul style="font-size:13px;padding-left:18px;display:flex;flex-direction:column;gap:6px;">
                    <li>How to find fully funded scholarships — ${serviceCounts['Scholarship database'] || 0} respondents want this</li>
                    <li>How to understand scholarship requirements — related to pain point "${topPain ? topPain[0] : '—'}"</li>
                    <li>How to prepare documents — ${painCounts['Documents'] || 0} respondents mentioned this</li>
                    <li>How to write a motivation letter — ${painCounts['Personal statement / motivation letter'] || 0} respondents mentioned this</li>
                    <li>How to apply step-by-step — ${serviceCounts['Step-by-step application guides'] || 0} respondents want this</li>
                    <li>How to avoid scholarship application mistakes — related to pain point "${painCounts['Application process'] || 0} respondents"</li>
                </ul>
            </div>`;

            document.getElementById('nextContent').innerHTML = html;
        }

        // ============================================================
        // PAGE NAVIGATION
        // ============================================================

        const pageRenderers = {
            overview: renderOverview,
            audience: renderAudience,
            goals: renderGoals,
            destinations: renderDestinations,
            painpoints: renderPainPoints,
            services: renderServices,
            payment: renderPayment,
            leads: renderLeads,
            crm: renderCRM,
            messages: renderMessages,
            quality: renderQuality,
            raw: renderRaw,
            product: renderProduct,
            next: renderNext
        };

        const pageTitles = {
            overview: 'Overview',
            audience: 'Audience Analysis',
            goals: 'Scholarship Goals',
            destinations: 'Destinations',
            painpoints: 'Pain Points',
            services: 'Service Demand',
            payment: 'Willingness to Pay',
            leads: 'Lead Intelligence',
            crm: 'CRM / Contacts',
            messages: 'Message Center',
            quality: 'Data Quality',
            raw: 'Raw Records',
            product: 'Product Strategy',
            next: 'What Should We Do Next?'
        };

        function switchPage(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
            document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
            const pageEl = document.getElementById('page-' + page);
            if (pageEl) pageEl.classList.remove('hidden');
            document.getElementById('pageTitle').textContent = pageTitles[page] || page;
            if (pageRenderers[page]) {
                pageRenderers[page]();
            }
        }

        // ============================================================
        // FILTER BAR POPULATION
        // ============================================================

        function populateFilters() {
            const eduSet = new Set(), intSet = new Set(), destSet = new Set(), svcSet = new Set(), paySet = new Set(), conSet = new Set();
            allRecords.forEach(r => {
                eduSet.add(r.educationCategory);
                intSet.add(r.interestCategory);
                destSet.add(r.destinationCategory);
                (r.services || []).forEach(s => svcSet.add(s));
                paySet.add(r.paymentInfo.category);
                conSet.add(r.contactability);
            });

            const fill = (id, values, labelFn) => {
                const sel = document.getElementById(id);
                const currentVal = sel.value;
                sel.innerHTML = `<option value="">${labelFn('')}</option>`;
                [...values].sort().forEach(v => {
                    if (v && v !== 'Unknown' && v !== 'Other' && v !== 'unclear') {
                        sel.innerHTML += `<option value="${v}">${labelFn(v)}</option>`;
                    }
                });
                sel.value = currentVal;
            };

            fill('filterEducation', eduSet, v => v || 'All Education');
            fill('filterInterest', intSet, v => v || 'All Interest');
            fill('filterDestination', destSet, v => v || 'All Destinations');
            fill('filterService', svcSet, v => v || 'All Services');
            fill('filterPayment', paySet, v => CONFIG.paymentCategories[v] || v || 'All Payment');
            fill('filterContact', conSet, v => v || 'All Contact');
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        function bindEvents() {
            // Navigation
            document.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', function() {
                    const page = this.dataset.page;
                    switchPage(page);
                });
            });

            // Menu toggle
            document.getElementById('menuToggle').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
            });

            // Search
            let searchTimeout;
            document.getElementById('globalSearch').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    activeFilters.search = this.value;
                    applyFilters();
                    const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'overview';
                    if (pageRenderers[activePage]) pageRenderers[activePage]();
                }, 300);
            });

            // Filters
            const filterIds = ['filterEducation', 'filterInterest', 'filterDestination', 'filterService', 'filterPayment', 'filterContact'];
            filterIds.forEach(id => {
                document.getElementById(id).addEventListener('change', function() {
                    const key = id.replace('filter', '').toLowerCase();
                    activeFilters[key] = this.value;
                    applyFilters();
                    const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'overview';
                    if (pageRenderers[activePage]) pageRenderers[activePage]();
                });
            });

            document.getElementById('filterDateFrom').addEventListener('change', function() {
                activeFilters.dateFrom = this.value;
                applyFilters();
                const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'overview';
                if (pageRenderers[activePage]) pageRenderers[activePage]();
            });
            document.getElementById('filterDateTo').addEventListener('change', function() {
                activeFilters.dateTo = this.value;
                applyFilters();
                const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'overview';
                if (pageRenderers[activePage]) pageRenderers[activePage]();
            });

            // Reset filters
            document.getElementById('resetFilters').addEventListener('click', function() {
                activeFilters = { education: '', interest: '', destination: '', service: '', payment: '', contact: '', dateFrom: '', dateTo: '', search: '' };
                document.getElementById('globalSearch').value = '';
                filterIds.forEach(id => document.getElementById(id).value = '');
                document.getElementById('filterDateFrom').value = '';
                document.getElementById('filterDateTo').value = '';
                applyFilters();
                const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'overview';
                if (pageRenderers[activePage]) pageRenderers[activePage]();
            });

            // Export
            document.getElementById('exportBtn').addEventListener('click', function() {
                exportCSV(filteredRecords);
            });

            // Modal close
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });
        }

        // ============================================================
        // INIT
        // ============================================================

        function init() {
            allRecords = processRecords(DATA);
            filteredRecords = [...allRecords];
            populateFilters();
            bindEvents();
            switchPage('overview');
            console.log(`MouriScholer: ${allRecords.length} records loaded.`);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
